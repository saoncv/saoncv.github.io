name: Auto-Build SSG Lattes + OpenAlex

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1' # Toda segunda-feira às 03:00 da manhã
  workflow_dispatch: # Permite rodar manualmente no GitHub

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        
      - name: Run Build Script (SSG KISS via uv)
        run: uv run build.py
        
      - name: Commit and Push Generated HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          git commit -m "chore(ssg): auto-rebuild site with fresh OpenAlex data via uv [skip ci]" || echo "No changes to commit"
          git push
